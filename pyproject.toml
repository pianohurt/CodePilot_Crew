[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codepilot"
version = "1.0.0"
description = "A local coding agent, developed one verifiable stage at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2", "textual>=6,<9", "jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
codepilot = "codepilot.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
filterwarnings = ["error"]
